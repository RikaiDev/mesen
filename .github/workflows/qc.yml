name: qc

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      # The ONNX artifacts are gitignored; stage them through the same hub the
      # CLI uses, so CI and a developer resolve artifacts identically.
      - run: uv run python -c "from mesen.hub import ensure_models; ensure_models()"
      - run: bash scripts/qc.sh
